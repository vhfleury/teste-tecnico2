# Spark driver logging for the Airflow task sessions. The Dockerfile bakes
# this file into pyspark's conf/ so every session picks it up. Spark writes
# its logs to stderr and Airflow labels every stderr line as ERROR, so the
# root level stays at WARN to keep task logs free of startup noise.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# The native-hadoop probe always fails on this image (no native libs) and
# Spark falls back to builtin-java classes; the warning is expected noise.
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error
