name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  # The transform suites never import the DAG modules (requirements.txt has no
  # Airflow), so this job installs Airflow — matching the image version — and
  # parses airflow/dags/ through a DagBag: a broken import or a bug in the
  # dynamic staging-DAG loop fails here instead of reaching CI green. Import is
  # enough (no JVM starts), so it needs no Java and no Docker.
  dag-parse:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install airflow (matches the image) + runtime deps
        run: |
          pip install "apache-airflow==3.1.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.5/constraints-3.11.txt"
          pip install -r requirements.txt
      - name: initialize airflow metadata db (sqlite)
        run: airflow db migrate
      - name: DAG parse smoke test
        run: pytest tests/dags -q

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/pipelines:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Sedona SQL functions need the jars on the JVM classpath; the
      # Docker image bakes them into pyspark/jars, so CI does the same.
      - name: install sedona jars into pyspark
        run: |
          PYSPARK_JARS="$(python -c 'import os, pyspark; print(os.path.join(os.path.dirname(pyspark.__file__), "jars"))')"
          curl -fSL "https://repo1.maven.org/maven2/org/apache/sedona/sedona-spark-shaded-3.5_2.12/1.9.0/sedona-spark-shaded-3.5_2.12-1.9.0.jar" \
            -o "${PYSPARK_JARS}/sedona-spark-shaded-3.5_2.12-1.9.0.jar"
          curl -fSL "https://repo1.maven.org/maven2/org/datasyslab/geotools-wrapper/1.9.0-33.5/geotools-wrapper-1.9.0-33.5.jar" \
            -o "${PYSPARK_JARS}/geotools-wrapper-1.9.0-33.5.jar"
      - name: analytics tests
        run: pytest tests/analytics
      - name: data_quality tests
        run: pytest tests/data_quality
      - name: general tests
        run: pytest tests/general
      - name: parser tests
        run: pytest tests/parser
      - name: pipelines tests
        run: pytest tests/pipelines
