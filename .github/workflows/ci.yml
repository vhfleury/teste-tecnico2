name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/pipelines:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: analytics tests
        run: pytest tests/analytics
      - name: data_quality tests
        run: pytest tests/data_quality
      - name: general tests
        run: pytest tests/general
      - name: parser tests
        run: pytest tests/parser
      - name: pipelines tests
        run: pytest tests/pipelines
